<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>icons</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://www.nerdfonts.com/assets/css/webfont.css">
<style>
  :root {
    --bg: #f6f4ef;
    --text: #333;
    --text-dim: #767676;
    --accent: #b5624c;
    --border: #e4ddd0;
    --card-bg: #fdfcfa;
    --font: 'Victor Mono', ui-monospace, 'SF Mono', monospace;
  }

  [data-theme="dark"] {
    --bg: #1c1a17;
    --text: #e8e3d9;
    --text-dim: #9a9184;
    --accent: #e08a6f;
    --border: #34302a;
    --card-bg: #24211d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 3rem 1.25rem 5rem;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 2rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1rem;
  }

  h1 {
    font-size: 1.1rem;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  h1::before {
    content: "✿ ";
    color: var(--accent);
  }

  .theme-toggle {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 0.75rem;
    padding: 0.3rem 0.6rem;
    border-radius: 4px;
    cursor: pointer;
  }

  .theme-toggle:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  select {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-family: var(--font);
    font-size: 0.85rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card-bg);
    color: var(--text);
    margin-bottom: 0.75rem;
    cursor: pointer;
  }

  select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .results-info {
    color: var(--text-dim);
    font-size: 0.75rem;
    margin-bottom: 0.35rem;
  }

  .license-info {
    color: var(--text-dim);
    font-size: 0.7rem;
    margin-bottom: 1.5rem;
    opacity: 0.8;
  }

  .items-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 0.75rem;
  }

  .item-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    padding: 1rem 0.7rem;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }

  .item-card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .item-icon {
    font-size: 2rem;
    width: 2rem;
    height: 2rem;
    margin: 0 auto 0.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
  }

  .item-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .item-icon .nf {
    font-size: 2rem;
    color: var(--accent);
  }

  .item-name {
    font-size: 0.65rem;
    color: var(--text-dim);
    word-break: break-word;
    line-height: 1.3;
  }

  .kaomoji-value {
    font-size: 1rem;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 0.6rem;
  }

  .copied-msg {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: var(--bg);
    padding: 0.5rem 1rem;
    border-radius: 6px;
    font-family: var(--font);
    font-size: 0.8rem;
    animation: fadeUp 0.2s ease;
    z-index: 1000;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translate(-50%, 6px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  footer {
    max-width: 640px;
    margin: 3rem auto 0;
    text-align: center;
    font-size: 0.7rem;
    color: var(--text-dim);
  }

  footer a { color: var(--text-dim); }
  footer a:hover { color: var(--accent); }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>icons</h1>
      <button class="theme-toggle" id="theme-toggle">dark</button>
    </header>

    <select id="packSelector">
      <optgroup label="colorful &amp; fun">
        <option value="fc">Flat Color Icons</option>
        <option value="vivid">Vivid Icons</option>
        <option value="logos">Brand Logos</option>
        <option value="pixelarticons">PixelArt Icons</option>
        <option value="noto-v1">Noto Color</option>
        <option value="twemoji">Twemoji</option>
        <option value="openmoji">OpenMoji</option>
        <option value="fxemoji">FxEmoji</option>
        <option value="bxs">BoxIcons Solid</option>
        <option value="grommet">Grommet Icons</option>
      </optgroup>
      <optgroup label="emoji, stickers &amp; 3d">
        <option value="fluent-emoji">Fluent Emoji</option>
        <option value="emojione">EmojiOne</option>
        <option value="3dicons">3D Icons</option>
        <option value="blob">Blob Emoji</option>
        <option value="kaomoji">Kaomoji</option>
        <option value="swe-stickers">Dev Icons</option>
        <option value="crypto">Crypto Icons</option>
        <option value="game-icons">Game Icons</option>
        <option value="country-flags">Country Flags</option>
        <option value="line-stickers">Line Stickers (WPF)</option>
      </optgroup>
      <optgroup label="requested packs">
        <option value="tabler">Tabler Icons</option>
        <option value="lucide">Lucide</option>
        <option value="hugeicons">HugeIcons</option>
        <option value="fa7-solid">Font Awesome (Solid)</option>
        <option value="nerd-fonts">Nerd Fonts — cute picks</option>
      </optgroup>
    </select>

    <div class="results-info">
      <span id="count"></span>
    </div>
    <div class="license-info" id="licenseInfo"></div>

    <div id="assetGrid" class="items-grid"></div>
  </div>

  <footer>
    <a href="https://glosse.me">glosse.me</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
