<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>arena index — eliana</title>
<style>
  :root {
    --bg: #fafaf8;
    --ink: #1a1a1a;
    --muted: #6b6b66;
    --line: #ddd9d0;
    --accent: #3a5a40;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  header {
    padding: 32px 24px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 16px 32px;
    align-items: baseline;
    justify-content: space-between;
  }
  header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header .sub {
    font-size: 13px;
    color: var(--muted);
  }
  #controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  #controls input[type="text"] {
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 5px;
    font-size: 13px;
    width: 220px;
  }
  #controls button {
    padding: 7px 14px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    border-radius: 5px;
    font-size: 13px;
    cursor: pointer;
  }
  #controls button:hover { opacity: 0.85; }
  #controls button.secondary {
    background: transparent;
    color: var(--ink);
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px;
  }
  #status {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
    min-height: 18px;
  }
  #status.error { color: #a33; }
  .channel {
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 18px;
    background: var(--card);
    overflow: hidden;
  }
  .channel-head {
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    flex-wrap: wrap;
  }
  .channel-head:hover { background: #f5f4f1; }
  .channel-title {
    font-size: 15px;
    font-weight: 600;
  }
  .channel-title a {
    color: var(--ink);
    text-decoration: none;
  }
  .channel-title a:hover { text-decoration: underline; }
  .channel-meta {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .channel-actions button {
    font-size: 11px;
    padding: 4px 9px;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 4px;
    cursor: pointer;
    color: var(--ink);
  }
  .channel-actions button:hover { background: #f0efe9; }
  .channel-blocks {
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    padding: 0 18px 18px;
  }
  .channel-blocks.open { display: grid; }
  .block {
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    background: #fdfdfc;
    font-size: 12px;
    display: flex;
    flex-direction: column;
  }
  .block img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    background: #eee;
  }
  .block-body {
    padding: 8px 9px;
  }
  .block-type {
    font-size: 10px;
    color: var(--muted);
    text-transform: lowercase;
    margin-bottom: 3px;
  }
  .block-title {
    color: var(--ink);
    text-decoration: none;
    display: block;
    word-break: break-word;
  }
  .block-title:hover { text-decoration: underline; }
  .block-text {
    color: var(--muted);
    font-size: 11px;
    max-height: 60px;
    overflow: hidden;
  }
  #loadMoreHint {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 20px;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>arena index</h1>
    <div class="sub">public channels + blocks for <span id="userLabel">eliana</span></div>
  </div>
  <div id="controls">
    <input type="text" id="usernameInput" placeholder="are.na username" value="eliana" />
    <button id="loadBtn">Load</button>
    <button id="exportAllBtn" class="secondary">Download all as markdown (.zip)</button>
  </div>
</header>

<main>
  <div id="status">Ready.</div>
  <div id="channels"></div>
</main>

<script>
const API_BASE = "https://api.are.na/v3";

const statusEl = document.getElementById("status");
const channelsEl = document.getElementById("channels");
const usernameInput = document.getElementById("usernameInput");
const userLabel = document.getElementById("userLabel");

let loadedChannels = []; // { channel, blocks: [] }

function setStatus(msg, isError) {
  statusEl.textContent = msg;
  statusEl.className = isError ? "error" : "";
}

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) {
    throw new Error(`${res.status} ${res.statusText} — ${url}`);
  }
  return res.json();
}

// Fetch all pages of a paginated /contents-style endpoint
async function fetchAllPages(baseUrl) {
  let page = 1;
  let all = [];
  while (true) {
    const url = `${baseUrl}${baseUrl.includes("?") ? "&" : "?"}page=${page}&per=100`;
    const json = await fetchJSON(url);
    const items = json.data || [];
    all = all.concat(items);
    const meta = json.meta || {};
    if (!meta.has_more_pages) break;
    page += 1;
  }
  return all;
}

async function loadUserChannels(username) {
  setStatus("Loading channels…");
  channelsEl.innerHTML = "";
  loadedChannels = [];

  let userContents;
  try {
    userContents = await fetchAllPages(`${API_BASE}/users/${encodeURIComponent(username)}/contents?type=Channel`);
  } catch (err) {
    setStatus(`Couldn't load user: ${err.message}`, true);
    return;
  }

  const channels = userContents.filter(item => item.type === "Channel");

  if (channels.length === 0) {
    setStatus("No public channels found for that username.");
    return;
  }

  setStatus(`Found ${channels.length} channel(s). Loading blocks…`);

  for (const channel of channels) {
    const card = renderChannelShell(channel);
    channelsEl.appendChild(card);
  }

  // Load blocks per channel, lazily on expand — but also prefetch counts already known
  setStatus(`Loaded ${channels.length} channel(s). Click a channel to view its blocks.`);
  loadedChannels = channels.map(c => ({ channel: c, blocks: null }));
}

function renderChannelShell(channel) {
  const wrap = document.createElement("div");
  wrap.className = "channel";
  wrap.dataset.slug = channel.slug;

  const head = document.createElement("div");
  head.className = "channel-head";

  const titleWrap = document.createElement("div");
  const title = document.createElement("div");
  title.className = "channel-title";
  const link = document.createElement("a");
  link.href = `https://www.are.na/${channel.owner?.slug || ""}/${channel.slug}`;
  link.target = "_blank";
  link.rel = "noopener";
  link.textContent = channel.title;
  title.appendChild(link);
  titleWrap.appendChild(title);

  const meta = document.createElement("div");
  meta.className = "channel-meta";
  const blockCount = channel.counts?.contents ?? channel.counts?.blocks ?? "?";
  meta.textContent = `${blockCount} items · ${channel.visibility || ""}`;
  titleWrap.appendChild(meta);

  head.appendChild(titleWrap);

  const actions = document.createElement("div");
  actions.className = "channel-actions";
  const exportBtn = document.createElement("button");
  exportBtn.textContent = "Export .md";
  exportBtn.addEventListener("click", async (e) => {
    e.stopPropagation();
    await exportChannelMarkdown(channel);
  });
  actions.appendChild(exportBtn);
  head.appendChild(actions);

  const blocksEl = document.createElement("div");
  blocksEl.className = "channel-blocks";

  head.addEventListener("click", async () => {
    const isOpen = blocksEl.classList.contains("open");
    if (isOpen) {
      blocksEl.classList.remove("open");
      return;
    }
    blocksEl.classList.add("open");
    if (blocksEl.dataset.loaded) return;
    blocksEl.innerHTML = `<div style="grid-column:1/-1;font-size:12px;color:var(--muted);">Loading…</div>`;
    try {
      const blocks = await fetchAllPages(`${API_BASE}/channels/${channel.id}/contents`);
      const entry = loadedChannels.find(c => c.channel.id === channel.id);
      if (entry) entry.blocks = blocks;
      renderBlocks(blocksEl, blocks);
      blocksEl.dataset.loaded = "1";
    } catch (err) {
      blocksEl.innerHTML = `<div style="grid-column:1/-1;font-size:12px;color:#a33;">Failed to load blocks: ${err.message}</div>`;
    }
  });

  wrap.appendChild(head);
  wrap.appendChild(blocksEl);
  return wrap;
}

function renderBlocks(container, blocks) {
  container.innerHTML = "";
  const contentBlocks = blocks.filter(b => b.type !== "Channel");
  if (contentBlocks.length === 0) {
    container.innerHTML = `<div style="grid-column:1/-1;font-size:12px;color:var(--muted);">No blocks yet.</div>`;
    return;
  }
  for (const block of contentBlocks) {
    container.appendChild(renderBlockCard(block));
  }
}

function getBlockImageUrl(block) {
  // ImageBlock has an image object with variants; be defensive across shapes
  if (block.image) {
    return block.image.display?.url || block.image.large?.url || block.image.original?.url || null;
  }
  return null;
}

function getBlockLinkUrl(block) {
  if (block.type === "LinkBlock" && block.source) return block.source.url || null;
  if (block._links?.self?.href) return block._links.self.href;
  return `https://www.are.na/block/${block.id}`;
}

function renderBlockCard(block) {
  const card = document.createElement("div");
  card.className = "block";

  const imgUrl = getBlockImageUrl(block);
  if (imgUrl) {
    const img = document.createElement("img");
    img.src = imgUrl;
    img.loading = "lazy";
    img.alt = block.title || "";
    card.appendChild(img);
  }

  const body = document.createElement("div");
  body.className = "block-body";

  const type = document.createElement("div");
  type.className = "block-type";
  type.textContent = (block.type || "block").replace("Block", "");
  body.appendChild(type);

  const titleLink = document.createElement("a");
  titleLink.className = "block-title";
  titleLink.href = getBlockLinkUrl(block);
  titleLink.target = "_blank";
  titleLink.rel = "noopener";
  titleLink.textContent = block.title || block.generated_title || "(untitled)";
  body.appendChild(titleLink);

  if (block.type === "TextBlock" && block.content) {
    const text = document.createElement("div");
    text.className = "block-text";
    text.textContent = block.content;
    body.appendChild(text);
  }

  card.appendChild(body);
  return card;
}

// --- Markdown export ---

function blockToMarkdownLine(block) {
  const type = (block.type || "Block").replace("Block", "").toLowerCase();
  const title = block.title || block.generated_title || "(untitled)";
  const url = getBlockLinkUrl(block);

  if (block.type === "ImageBlock") {
    const imgUrl = getBlockImageUrl(block);
    return `- **[${type}]** [${title}](${url})${imgUrl ? `\n  ![${title}](${imgUrl})` : ""}`;
  }
  if (block.type === "TextBlock") {
    const snippet = (block.content || "").slice(0, 200).replace(/\n/g, " ");
    return `- **[${type}]** ${title}${snippet ? ` — ${snippet}` : ""}`;
  }
  return `- **[${type}]** [${title}](${url})`;
}

async function getChannelBlocks(channel) {
  const entry = loadedChannels.find(c => c.channel.id === channel.id);
  if (entry && entry.blocks) return entry.blocks;
  const blocks = await fetchAllPages(`${API_BASE}/channels/${channel.id}/contents`);
  if (entry) entry.blocks = blocks;
  return blocks;
}

function buildChannelMarkdown(channel, blocks) {
  const contentBlocks = blocks.filter(b => b.type !== "Channel");
  const arenaUrl = `https://www.are.na/${channel.owner?.slug || ""}/${channel.slug}`;
  const lines = [];
  lines.push(`# ${channel.title}`);
  lines.push("");
  lines.push(`[View on Are.na](${arenaUrl})`);
  lines.push("");
  lines.push(`${contentBlocks.length} block(s) · last updated ${channel.updated_at ? channel.updated_at.slice(0, 10) : ""}`);
  lines.push("");
  for (const block of contentBlocks) {
    lines.push(blockToMarkdownLine(block));
  }
  lines.push("");
  return lines.join("\n");
}

function downloadText(filename, text) {
  const blob = new Blob([text], { type: "text/markdown" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function exportChannelMarkdown(channel) {
  setStatus(`Building markdown for "${channel.title}"…`);
  try {
    const blocks = await getChannelBlocks(channel);
    const md = buildChannelMarkdown(channel, blocks);
    downloadText(`${channel.slug}.md`, md);
    setStatus(`Downloaded ${channel.slug}.md`);
  } catch (err) {
    setStatus(`Failed to export "${channel.title}": ${err.message}`, true);
  }
}

document.getElementById("exportAllBtn").addEventListener("click", async () => {
  if (loadedChannels.length === 0) {
    setStatus("Load channels first.", true);
    return;
  }
  setStatus("Building markdown files for all channels…");
  for (const { channel } of loadedChannels) {
    try {
      const blocks = await getChannelBlocks(channel);
      const md = buildChannelMarkdown(channel, blocks);
      downloadText(`${channel.slug}.md`, md);
    } catch (err) {
      console.error(`Failed on ${channel.slug}`, err);
    }
  }
  setStatus(`Downloaded markdown files for ${loadedChannels.length} channel(s). Check your downloads folder.`);
});

document.getElementById("loadBtn").addEventListener("click", () => {
  const username = usernameInput.value.trim();
  if (!username) return;
  userLabel.textContent = username;
  loadUserChannels(username);
});

usernameInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("loadBtn").click();
});

// Auto-load on page open
loadUserChannels(usernameInput.value.trim());
</script>

</body>
</html>
